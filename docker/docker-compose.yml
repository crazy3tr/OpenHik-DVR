version: '3.8'

services:
  # Service 1: Modern ActiveX-Free Web Dashboard (Chrome / Safari / iOS / Android)
  openhik-dashboard:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: openhik-dashboard
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - DVR_HOST=192.168.1.100
      - DVR_PORT=80
      - DVR_USER=admin
      - DVR_PASS=password123
      - WEB_PORT=8080
    command: >
      sh -c "python tools/web_dashboard.py
      --host $$DVR_HOST
      --port $$DVR_PORT
      --user $$DVR_USER
      --pass \"$$DVR_PASS\"
      --bind 0.0.0.0
      --web-port $$WEB_PORT"

  # Service 2: Automated Turnkey Hard Disk Archiver & Backup Job
  openhik-backup:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: openhik-backup
    restart: "no"
    volumes:
      - ./recordings:/recordings
    environment:
      - DVR_HOST=192.168.1.100
      - DVR_PORT=80
      - DVR_USER=admin
      - DVR_PASS=password123
      - CHANNEL=1
      - DAYS=7
      - OUTPUT_DIR=/recordings
    command: >
      sh -c "python tools/hik_backup.py
      --host $$DVR_HOST
      --port $$DVR_PORT
      --user $$DVR_USER
      --pass \"$$DVR_PASS\"
      --channel $$CHANNEL
      --days $$DAYS
      --out $$OUTPUT_DIR"
